[project]
name = "canvadraw"
version = "0.1.0"
description = "Predict the next canvas UI frame from a screenshot and click position"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "torch>=2.14,<3",
    "torchvision>=0.29,<1",
    "uvicorn[standard]>=0.52,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
